<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">КАРКАС ENGINE 5 · Дом 10×8 м: каркас или профилированный брус — что купить</title>
<desc id="desc">Сравнение сметы, древесины, ОСП, утеплителя и нагрузки на фундамент по data.json. В исходных данных чистый объём утеплителя не совпадает с разностью брутто и древесины; все исходные значения сохранены.</desc>
